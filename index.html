<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regale Invito di Compleanno</title>
  <!-- Google Fonts per calligrafia e titoli regali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Sfondo della pagina */
      --bg-gradient: linear-gradient(135deg, #fde2e4 0%, #f7d6e0 40%, #e2ece9 75%, #f4acb7 100%);
      --text-color: #3b0764;
      --accent-gold: #9d174d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    .instruction {
      margin-bottom: 25px;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
      text-align: center;
    }

    /* Contenitore Pergamena */
    .scroll-container {
      position: relative;
      width: 330px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Rotolo Superiore (Senza cerchi laterali) */
    .top-roll-container {
      width: 350px;
      height: 38px;
      position: relative;
      z-index: 6;
    }

    .top-roll {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #5c3a1e 0%, #d5b38a 40%, #fff8ee 70%, #5c3a1e 100%);
      border-radius: 18px 18px 8px 8px;
      box-shadow: 0 5px 10px rgba(0,0,0,0.25);
      border-bottom: 2px solid #3d2310;
    }

    /* Foglio centrale con bordi bruciati e interno bianco sporco */
    .scroll-paper {
      position: relative;
      width: 320px;
      height: 0px; /* Da chiusa le estremità si toccano */
      background: radial-gradient(circle at center, #ffffff 10%, #fefcf7 50%, #f3e5ce 80%, #a87948 95%, #4a2e16 100%);
      border-left: 2px solid #5c3b1e;
      border-right: 2px solid #5c3b1e;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2), inset 0 0 15px rgba(60, 35, 15, 0.4);
      overflow: hidden;
      /* Srotolamento */
      transition: height 2s cubic-bezier(0.25, 1, 0.5, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 25px;
      /* Bordo irregolare/bruciacchiato tramite clip-path */
      clip-path: polygon(
        0% 0%, 100% 0%, 
        98% 15%, 100% 30%, 97% 45%, 100% 60%, 98% 75%, 100% 90%, 99% 100%,
        1% 100%, 2% 85%, 0% 70%, 3% 55%, 0% 40%, 2% 25%, 0% 10%
      );
    }

    /* Rotolo Inferiore (Senza cerchi laterali) */
    .bottom-roll-container {
      width: 350px;
      height: 42px;
      position: relative;
      z-index: 6;
    }

    .bottom-roll {
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #614022 0%, #c49a6c 40%, #e2caaa 70%, #4a2e16 100%);
      border-radius: 8px 8px 20px 20px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.3);
      border-top: 2px solid #3d2310;
    }

    /* Sigillo di Ceralacca Rosso con Cordoncini */
    .wax-seal-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: opacity 0.5s ease, transform 0.5s ease;
      pointer-events: none;
    }

    /* Cordoncino che spunta sotto la ceralacca */
    .wax-ribbon {
      width: 4px;
      height: 45px;
      background: linear-gradient(180deg, #b91c1c, #7f1d1d);
      box-shadow: 1px 2px 4px rgba(0,0,0,0.3);
      position: absolute;
      top: 20px;
    }
    .wax-ribbon.left {
      transform: rotate(-8deg);
      left: -4px;
    }
    .wax-ribbon.right {
      transform: rotate(8deg);
      right: -4px;
    }

    /* Medaglione in Ceralacca */
    .wax-seal {
      width: 48px;
      height: 48px;
      background: radial-gradient(circle at 35% 35%, #ef4444 0%, #991b1b 60%, #450a0a 100%);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4), inset 0 0 6px rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 2px solid #7f1d1d;
    }

    .wax-seal::after {
      content: '★';
      color: #fef08a;
      font-size: 20px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    /* Contenuto del Testo */
    .scroll-content {
      text-align: center;
      color: var(--text-color);
      position: relative;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    .scroll-content h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: #581c87;
      letter-spacing: 2px;
      text-transform: uppercase;
      min-height: 1.4em;
      text-shadow: 0 0 1px rgba(255,255,255,0.8);
    }

    .scroll-content .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      line-height: 1.4;
      font-weight: 400;
      min-height: 2.8em;
    }

    .scroll-content .details {
      background: rgba(255, 255, 255, 0.85);
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      border: 1px dashed #c084fc;
      font-size: 0.82rem;
      line-height: 1.6;
      min-height: 80px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .scroll-content .quote {
      font-family: 'Great Vibes', cursive;
      font-size: 1.4rem;
      color: #9d174d;
      line-height: 1.3;
      min-height: 2.6em;
    }

    .scroll-content .note {
      font-size: 0.75rem;
      color: #6b21a8;
      font-style: italic;
      min-height: 1.8em;
    }

    /* STATO APERTO DELLA PERGAMENA */
    .scroll-container.open .scroll-paper {
      height: 420px;
    }

    .scroll-container.open .wax-seal-wrapper {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.3);
    }

    /* Micro-Brillantini Densi Bianco/Oro Perlato Luminosissimi */
    .magic-sparkle {
      position: fixed;
      pointer-events: none;
      width: 4px;
      height: 4px;
      background: radial-gradient(circle, #ffffff 40%, #fef08a 80%, #f59e0b 100%);
      border-radius: 50%;
      box-shadow: 0 0 6px #ffffff, 0 0 10px #fef08a, 0 0 14px #fbbf24;
      animation: magicGlow 0.45s ease-out forwards;
      z-index: 100;
    }

    @keyframes magicGlow {
      0% { transform: scale(0.4) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.8) rotate(180deg); opacity: 1; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }

    /* Brillantini decorativi al tocco */
    .sparkle {
      position: absolute;
      pointer-events: none;
      background: radial-gradient(circle, #ffffff 30%, #fde047 100%);
      border-radius: 50%;
      animation: animateSparkle 0.9s linear forwards;
      z-index: 20;
    }

    @keyframes animateSparkle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="instruction" id="text-hint">Partecipazione al Regale Evento</div>

  <div class="scroll-container" id="scroll">
    
    <!-- Rotolo Superiore -->
    <div class="top-roll-container">
      <div class="top-roll"></div>
    </div>

    <!-- Sigillo in Ceralacca -->
    <div class="wax-seal-wrapper">
      <div class="wax-ribbon left"></div>
      <div class="wax-ribbon right"></div>
      <div class="wax-seal"></div>
    </div>

    <!-- Foglio della Pergamena -->
    <div class="scroll-paper">
      
      <!-- Contenitore del Testo -->
      <div class="scroll-content">
        <h1 id="text-h1"></h1>
        <p class="subtitle" id="text-sub"></p>
        
        <div class="details" id="text-det"></div>

        <div>
          <p class="quote" id="text-quo"></p>
          <p class="note" id="text-not"></p>
        </div>
      </div>

    </div>

    <!-- Rotolo Inferiore -->
    <div class="bottom-roll-container">
      <div class="bottom-roll"></div>
    </div>

  </div>

  <script>
    const scrollContainer = document.getElementById('scroll');
    const hint = document.getElementById('text-hint');

    const texts = [
      { id: 'text-h1', content: 'Per Regale Decreto' },
      { id: 'text-sub', content: 'Siete cordialmente invitati al raffinato Brunch di Compleanno in mio onore.' },
      { id: 'text-det', content: '<strong>Data:</strong> Domenica 20 Settembre<br><strong>Luogo:</strong> Reggia Celeste a Vittime di Peteano, Reame di Fiumicello<br><strong>Ora d\'Inizio:</strong> 10:30' },
      { id: 'text-quo', content: '«L\'unico prezioso dono richiesto alla Vostra presenza è la Vostra nobilissima persona.»' },
      { id: 'text-not', content: 'Un messo reale raccoglierà la vostra risposta.' }
    ];

    let isOpen = false;
    let typeTimeouts = [];

    scrollContainer.addEventListener('click', (e) => {
      // Se è già aperta, non fa nulla (non si richiude)
      if (isOpen) return;

      isOpen = true;
      scrollContainer.classList.add('open');
      createSparkles(e);
      hint.textContent = 'Vostra Altezza vi ringrazia';
      
      // Avvia la scrittura magica dopo lo srotolamento (1.9 sec)
      setTimeout(() => {
        startMagicTyping();
      }, 1900);
    });

    // Scrittura Magica con Micro-Scintille Dense
    function startMagicTyping() {
      let sectionIndex = 0;

      function typeNextSection() {
        if (sectionIndex >= texts.length) {
          return;
        }

        const sec = texts[sectionIndex];
        const elem = document.getElementById(sec.id);
        const rawHTML = sec.content;

        let charIndex = 0;

        function typeChar() {
          if (charIndex <= rawHTML.length) {
            // Ignora i tag HTML per non romperli nel rendering
            if (rawHTML[charIndex] === '<') {
              charIndex = rawHTML.indexOf('>', charIndex) + 1;
            }

            elem.innerHTML = rawHTML.substring(0, charIndex);

            // Genera micro-brillantini dorati/bianchi per ogni lettera
            if (charIndex > 0 && charIndex <= rawHTML.length) {
              spawnCharSparkles(elem, 3);
            }

            charIndex++;
            let timeout = setTimeout(typeChar, 35);
            typeTimeouts.push(timeout);
          } else {
            sectionIndex++;
            let timeout = setTimeout(typeNextSection, 150);
            typeTimeouts.push(timeout);
          }
        }

        typeChar();
      }

      typeNextSection();
    }

    // Generatore di Micro-Brillantini Densi vicino al punto di scrittura
    function spawnCharSparkles(element, count) {
      const rect = element.getBoundingClientRect();
      
      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('magic-sparkle');

        const offsetX = (Math.random() - 0.5) * 16;
        const offsetY = (Math.random() - 0.5) * 12;

        const x = rect.left + rect.width * (0.1 + Math.random() * 0.8) + offsetX;
        const y = rect.top + rect.height * Math.random() + offsetY;

        sparkle.style.left = `${x}px`;
        sparkle.style.top = `${y}px`;

        document.body.appendChild(sparkle);

        setTimeout(() => {
          sparkle.remove();
        }, 450);
      }
    }

    function createSparkles(e) {
      const count = 25;
      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        
        const size = Math.random() * 4 + 2;
        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;

        sparkle.style.left = `${e.clientX || window.innerWidth/2}px`;
        sparkle.style.top = `${e.clientY || window.innerHeight/2}px`;

        const dx = (Math.random() - 0.5) * 160;
        const dy = (Math.random() - 0.5) * 160;
        sparkle.style.setProperty('--dx', `${dx}px`);
        sparkle.style.setProperty('--dy', `${dy}px`);

        document.body.appendChild(sparkle);

        setTimeout(() => {
          sparkle.remove();
        }, 900);
      }
    }
  </script>

</body>
</html>
