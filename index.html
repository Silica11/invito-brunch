<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regale Invito di Compleanno</title>
  <!-- Google Fonts per calligrafia e titoli regali -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      /* Sfondo Macaron / Pastello */
      --bg-gradient: linear-gradient(135deg, #fde2e4 0%, #f7d6e0 40%, #e2ece9 75%, #f4acb7 100%);
      --scroll-paper: #fcf8f2;   /* Colore guscio d'uovo / pergamena */
      --scroll-border: #e8d5c4;  /* Bordo sfumato pergamena */
      --text-color: #3b0764;
      --accent-gold: #9d174d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-gradient);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 20px;
    }

    .instruction {
      margin-bottom: 25px;
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      color: var(--accent-gold);
      letter-spacing: 2px;
      text-transform: uppercase;
      animation: pulse 2s infinite;
      text-align: center;
    }

    /* Contenitore Pergamena */
    .scroll-container {
      position: relative;
      width: 320px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Rotoli di carta arrotolata in alto e in basso */
    .paper-roll {
      width: 340px;
      height: 28px;
      background: linear-gradient(180deg, #e3d2be 0%, #f7eee1 50%, #d8c2aa 100%);
      border-radius: 14px / 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
      position: relative;
      z-index: 5;
      border: 1px solid #d4beaa;
    }

    /* Spirale laterale per simulare il foglio arrotolato su se stesso */
    .paper-roll::before, .paper-roll::after {
      content: '';
      position: absolute;
      top: 2px;
      width: 14px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #b89f88;
      background: #ebd8c5;
    }
    .paper-roll::before { left: 4px; }
    .paper-roll::after { right: 4px; }

    /* Foglio centrale che si srotola */
    .scroll-paper {
      position: relative;
      width: 310px;
      height: 0px; /* Da chiusa le due estremità si toccano */
      background-color: var(--scroll-paper);
      background-image: radial-gradient(#f3e9dc 1px, transparent 1px);
      background-size: 16px 16px;
      border-left: 3px double var(--scroll-border);
      border-right: 3px double var(--scroll-border);
      box-shadow: inset 0 0 20px rgba(216, 194, 170, 0.3);
      overflow: hidden;
      transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 0 20px;
    }

    /* Cordoncino attorno alla pergamena chiusa */
    .cord {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 325px;
      height: 18px;
      background: repeating-linear-gradient(
        45deg,
        #f472b6,
        #f472b6 8px,
        #fbbf24 8px,
        #fbbf24 16px
      );
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.2);
      z-index: 10;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    /* Fiocco centrale del cordoncino */
    .cord::after {
      content: '🎀';
      font-size: 22px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -55%);
    }

    /* Contenuto del Testo */
    .scroll-content {
      text-align: center;
      color: var(--text-color);
      position: relative;
      min-height: 350px;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
    }

    .scroll-content h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.1rem;
      color: #701a75;
      letter-spacing: 2px;
      text-transform: uppercase;
      min-height: 1.4em;
    }

    .scroll-content .subtitle {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.8rem;
      line-height: 1.4;
      font-weight: 300;
      min-height: 2.8em;
    }

    .scroll-content .details {
      background: rgba(250, 245, 255, 0.75);
      padding: 12px;
      border-radius: 6px;
      margin: 10px 0;
      border: 1px dashed #d8b4fe;
      font-size: 0.82rem;
      line-height: 1.6;
      min-height: 80px;
    }

    .scroll-content .quote {
      font-family: 'Great Vibes', cursive;
      font-size: 1.35rem;
      color: var(--accent-gold);
      line-height: 1.3;
      min-height: 2.6em;
    }

    .scroll-content .note {
      font-size: 0.7rem;
      color: #6b21a8;
      font-style: italic;
      min-height: 2em;
    }

    /* STATO APERTO DELLA PERGAMENA */
    .scroll-container.open .scroll-paper {
      height: 420px;
    }

    .scroll-container.open .cord {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.5);
      pointer-events: none;
    }

    /* Brillantino sulla Lettera in corso di Scrittura */
    .magic-sparkle {
      position: fixed;
      pointer-events: none;
      width: 10px;
      height: 10px;
      background: radial-gradient(circle, #ffffff 20%, #f472b6 60%, transparent 100%);
      border-radius: 50%;
      box-shadow: 0 0 10px #f472b6, 0 0 18px #fbbf24;
      animation: magicGlow 0.4s ease-out forwards;
      z-index: 100;
    }

    @keyframes magicGlow {
      0% { transform: scale(0.3) rotate(0deg); opacity: 1; }
      50% { transform: scale(1.8) rotate(180deg); opacity: 1; }
      100% { transform: scale(0) rotate(360deg); opacity: 0; }
    }

    /* Brillantini generici al click */
    .sparkle {
      position: absolute;
      pointer-events: none;
      background: radial-gradient(circle, #fff 10%, #f472b6 100%);
      border-radius: 50%;
      animation: animateSparkle 1s linear forwards;
      z-index: 20;
    }

    @keyframes animateSparkle {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--dx), var(--dy)) scale(0); opacity: 0; }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.03); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="instruction" id="text-hint">Partecipazione al Regale Evento</div>

  <div class="scroll-container" id="scroll">
    
    <!-- Rotolo Superiore -->
    <div class="paper-roll"></div>

    <!-- Cordoncino -->
    <div class="cord"></div>

    <!-- Foglio della Pergamena -->
    <div class="scroll-paper">
      
      <!-- Contenitore del Testo -->
      <div class="scroll-content">
        <h1 id="text-h1"></h1>
        <p class="subtitle" id="text-sub"></p>
        
        <div class="details" id="text-det"></div>

        <div>
          <p class="quote" id="text-quo"></p>
          <p class="note" id="text-not"></p>
        </div>
      </div>

    </div>

    <!-- Rotolo Inferiore -->
    <div class="paper-roll"></div>

  </div>

  <script>
    const scrollContainer = document.getElementById('scroll');
    const hint = document.getElementById('text-hint');

    // Testi divisi per sezione
    const texts = [
      { id: 'text-h1', content: 'Per Regale Decreto' },
      { id: 'text-sub', content: 'Siete cordialmente invitati al raffinato Brunch di Compleanno in mio onore.' },
      { id: 'text-det', content: '<strong>Data:</strong> Domenica 20 Settembre<br><strong>Luogo:</strong> Reggia Celeste a Vittime di Peteano, Reame di Fiumicello<br><strong>Ora d\'Inizio:</strong> 10:30' },
      { id: 'text-quo', content: '«L\'unico prezioso dono richiesto alla Vostra presenza è la Vostra nobilissima persona.»' },
      { id: 'text-not', content: 'Un messo reale raccoglierà la vostra risposta... ma nell\'attesa, è gradita la conferma via chat di corte.' }
    ];

    let isTyping = false;
    let typeTimeouts = [];

    scrollContainer.addEventListener('click', (e) => {
      createSparkles(e);

      if (!scrollContainer.classList.contains('open')) {
        scrollContainer.classList.add('open');
        hint.textContent = 'Vostra Altezza vi ringrazia';
        
        // Avvia la scrittura magica lettera per lettera dopo lo srotolamento (1 sec)
        setTimeout(() => {
          startMagicTyping();
        }, 1000);

      } else {
        scrollContainer.classList.remove('open');
        hint.textContent = 'Partecipazione al Regale Evento';
        resetTyping();
      }
    });

    // Funzione Scrittura Magica con Brillantini
    function startMagicTyping() {
      resetTyping();
      isTyping = true;

      let sectionIndex = 0;

      function typeNextSection() {
        if (sectionIndex >= texts.length) {
          isTyping = false;
          return;
        }

        const sec = texts[sectionIndex];
        const elem = document.getElementById(sec.id);
        const rawHTML = sec.content;

        // Se la sezione contiene tag HTML (es. <strong> o <br>) li convertiamo per digitare solo il testo
        let charIndex = 0;

        function typeChar() {
          if (charIndex <= rawHTML.length) {
            // Gestione dei tag HTML per evitare di spezzarli durante il typing
            if (rawHTML[charIndex] === '<') {
              charIndex = rawHTML.indexOf('>', charIndex) + 1;
            }

            elem.innerHTML = rawHTML.substring(0, charIndex);

            // Genera brillantino sopra la posizione della nuova lettera
            if (charIndex > 0 && charIndex <= rawHTML.length) {
              spawnCharSparkle(elem);
            }

            charIndex++;
            let timeout = setTimeout(typeChar, 35); // Velocità di scrittura
            typeTimeouts.push(timeout);
          } else {
            sectionIndex++;
            let timeout = setTimeout(typeNextSection, 150);
            typeTimeouts.push(timeout);
          }
        }

        typeChar();
      }

      typeNextSection();
    }

    function resetTyping() {
      typeTimeouts.forEach(t => clearTimeout(t));
      typeTimeouts = [];
      texts.forEach(sec => {
        document.getElementById(sec.id).innerHTML = '';
      });
      isTyping = false;
    }

    // Effetto Brillantino luminoso su ogni lettera scritta
    function spawnCharSparkle(element) {
      const rect = element.getBoundingClientRect();
      const sparkle = document.createElement('div');
      sparkle.classList.add('magic-sparkle');

      // Posiziona il brillantino nell'area in cui si sta scrivendo
      const x = rect.left + rect.width * (0.1 + Math.random() * 0.8);
      const y = rect.top + rect.height * Math.random();

      sparkle.style.left = `${x}px`;
      sparkle.style.top = `${y}px`;

      document.body.appendChild(sparkle);

      setTimeout(() => {
        sparkle.remove();
      }, 400);
    }

    function createSparkles(e) {
      const count = 20;
      for (let i = 0; i < count; i++) {
        const sparkle = document.createElement('div');
        sparkle.classList.add('sparkle');
        
        const size = Math.random() * 6 + 3;
        sparkle.style.width = `${size}px`;
        sparkle.style.height = `${size}px`;

        sparkle.style.left = `${e.clientX || window.innerWidth/2}px`;
        sparkle.style.top = `${e.clientY || window.innerHeight/2}px`;

        const dx = (Math.random() - 0.5) * 180;
        const dy = (Math.random() - 0.5) * 180;
        sparkle.style.setProperty('--dx', `${dx}px`);
        sparkle.style.setProperty('--dy', `${dy}px`);

        document.body.appendChild(sparkle);

        setTimeout(() => {
          sparkle.remove();
        }, 1000);
      }
    }
  </script>

</body>
</html>
